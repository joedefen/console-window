name: CI

on:
  push:
  pull_request:

# Pin the runner image instead of `ubuntu-latest`, whose label is being
# migrated to a newer Ubuntu release.  Action majors below are Node 24 builds,
# so the Node 20 deprecation warning stays out of the annotations.
jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 pytest-cov==7.1.0
      - name: Run tests (TTY-free) with coverage floor
        run: python -m pytest -q --cov=console_window --cov-fail-under=80

  lint:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff==0.17.0
      - name: Lint
        run: ruff check .

  types:
    name: mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install mypy
        run: python -m pip install mypy==2.4.0
      - name: Type check
        run: python -m mypy

  pylint:
    name: pylint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pylint
        run: python -m pip install pylint==3.3.4
      - name: Lint
        # `runner` is a bash launcher, not Python; pylint cannot parse it.
        run: python -m pylint console_window --disable=C,R
