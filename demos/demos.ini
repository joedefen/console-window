[demos]
10: # A - basic pager (one Screen, live data, no help page)
    ./run-demo a-basic
20: # B - two pages (ScreenStack, per-screen state, Ctrl-C key)
    ./run-demo b-stack
30: # C - options (OptionSpinner, validated prompt, scoped help)
    ./run-demo c-options
40: # D - pick a row (pick mode, Context, DECOR, abut, pick range)
    ./run-demo d-pick
50: # E - filter as you type (IncrementalSearchBar, passthrough)
    ./run-demo e-search
60: # F - ask in place (begin_prompt, row and header placement)
    ./run-demo f-prompts
70: # G - dialogs and the inline editor (answer, alert, InlineConfirmation)
    ./run-demo g-dialogs
80: # H - messages (status levels, lifecycle, placement, flash)
    ./run-demo h-messages
90: # I - header composition (tokens, modes, Span styling)
    ./run-demo i-headers
100: # J - themes and appearance (picker, store, mono, semantic attrs)
    ./run-demo j-themes
110: # K - glyphs and ASCII (catalog, vocabulary, fallback, help)
    ./run-demo k-glyphs
120: # L - read-only screens (BasicTextScreen, help paragraphs)
    ./run-demo l-text-screens
130: # M - own the navigation keys (taken_nav_keys, paged navigation)
    ./run-demo m-own-keys
140: # N - pause and run (suspend/resume, external program)
    ./run-demo n-suspend
150: # O - large bodies and limits (2000 rows, max_rows, min size)
    ./run-demo o-large-bodies
160: # P - keys and widths (demo mode, textwidth, wide characters)
    ./run-demo p-key-debug
x: exit
