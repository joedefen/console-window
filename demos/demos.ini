[demos]
a: # A - basic pager (one Screen, live data, no help page)
    ./run-demo a-basic
b: # B - two pages (ScreenStack, per-screen state, Ctrl-C key)
    ./run-demo b-stack
c: # C - options (OptionSpinner, validated prompt, scoped help)
    ./run-demo c-options
d: # D - pick a row (pick mode, Context, DECOR, abut, pick range, checks)
    ./run-demo d-pick
e: # E - filter as you type (regex filter, IncrementalSearchBar, passthrough)
    ./run-demo e-search
f: # F - ask in place (begin_prompt, row and header placement)
    ./run-demo f-prompts
g: # G - dialogs and the inline editor (answer, alert, InlineConfirmation)
    ./run-demo g-dialogs
h: # H - messages (status levels, lifecycle, placement, flash)
    ./run-demo h-messages
i: # I - header composition (tokens, modes, Span styling)
    ./run-demo i-headers
j: # J - themes and appearance (picker, store, mono, semantic attrs)
    ./run-demo j-themes
k: # K - glyphs and ASCII (catalog, vocabulary, fallback, help)
    ./run-demo k-glyphs
l: # L - read-only screens (BasicTextScreen, help paragraphs)
    ./run-demo l-text-screens
m: # M - own the navigation keys (taken_nav_keys, paged navigation)
    ./run-demo m-own-keys
n: # N - pause and run (suspend/resume, external program)
    ./run-demo n-suspend
o: # O - large bodies and limits (2000 rows, max_rows, min size)
    ./run-demo o-large-bodies
p: # P - keys and widths (demo mode, textwidth, wide characters)
    ./run-demo p-key-debug
x: exit
