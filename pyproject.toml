# pyproject.toml
# TEST basic imports
#    python -m venv test_venv
#    source test_venv/bin/activate
#    python3 -m venv test_venv
#    source test_venv/bin/activate
#    pip install dist/console_window-0.1.0-py3-none-any.whl
#    python3 # within, from console_window import ConsoleWindow
#    deactivate
#    rm -rf test_venv/


[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

# ----------------------------------------------------------------------
# FLIT MODULE CONFIGURATION
[tool.flit.module]
name = "console_window"

# ----------------------------------------------------------------------
# UNIFIED PROJECT METADATA (Replaces [tool.flit.metadata])
[project]
name = "console-window" 
version = "2.0.1"
description = "A robust curses wrapper for creating Text User Interfaces (TUIs)."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}

dependencies = [
    # "dependency-name >= version", 
]

authors = [
    {name = "Joe Defen", email = "joedef@duck.com"},
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Terminals",
    "Topic :: Software Development :: User Interfaces",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ----------------------------------------------------------------------
# RUFF LINT CONFIGURATION
[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "ANN", "RUF"]
# E501 (line length) is left to the editor; E701/E731 are pre-existing compact
# style choices that are tracked separately (see AUDIT.md §4.10).
ignore = ["E501", "E701", "E731"]

[tool.ruff.lint.per-file-ignores]
# Tests, the interactive demo, and the package self-test are not part of the
# typed public API, so annotation rules do not apply there.
"tests/**" = ["ANN"]
"ConsoleWindowDemo.py" = ["ANN"]
