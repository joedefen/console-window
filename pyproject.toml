[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

# ----------------------------------------------------------------------
# FLIT MODULE CONFIGURATION
[tool.flit.module]
name = "console_window"

# ----------------------------------------------------------------------
# UNIFIED PROJECT METADATA (Replaces [tool.flit.metadata])
[project]
name = "console-window"
dynamic = ["version"]
description = "A robust curses wrapper for creating Text User Interfaces (TUIs)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

dependencies = [
    # "dependency-name >= version", 
]

authors = [
    {name = "Joe Defen", email = "joedef@duck.com"},
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Terminals",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/joedefen/console-window"
Repository = "https://github.com/joedefen/console-window"
Issues = "https://github.com/joedefen/console-window/issues"
Changelog = "https://github.com/joedefen/console-window/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pad overflow is a UserWarning rather than an error, by design: a user's app
# should be told and keep limping (AUDIT.md §3.2).  Our own code has no such
# excuse, so within this suite any UserWarning fails the run -- which is how the
# sample app's too-small head pad and its truncated help screen were found.
filterwarnings = ["error::UserWarning"]

# ----------------------------------------------------------------------
# RUFF LINT CONFIGURATION
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "ANN", "RUF", "C901"]
# E501 (line length) is left to the editor; E701/E731 are pre-existing compact
# style choices that are tracked separately.
ignore = ["E501", "E701", "E731"]

[tool.ruff.lint.mccabe]
# Ratchet, not a target: `answer()` is the most complex function left at 12.
# `prompt()` used to be 43; it is decomposed now, so this ceiling stops any
# function from drifting back toward a single unmaintainable block.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests and the interactive demo are not part of the typed public API, so
# annotation rules do not apply there.
"tests/**" = ["ANN"]
"SampleApp.py" = ["ANN"]

# ----------------------------------------------------------------------
# MYPY TYPE CHECKING
[tool.mypy]
python_version = "3.10"
# Check the library, not the tests/example: those are unannotated by design
# (see the ruff per-file-ignores above).
files = ["console_window"]
ignore_missing_imports = true
warn_unused_ignores = true
# Modest on purpose: ruff already requires annotations, but requiring a fully
# typed body in every function would flag the curses/dynamic-object edges first.
disallow_untyped_defs = false
