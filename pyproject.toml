[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

# ----------------------------------------------------------------------
# FLIT MODULE CONFIGURATION
[tool.flit.module]
name = "console_window"

# ----------------------------------------------------------------------
# UNIFIED PROJECT METADATA (Replaces [tool.flit.metadata])
[project]
name = "console-window"
dynamic = ["version"]
description = "A robust curses wrapper for creating Text User Interfaces (TUIs)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

dependencies = [
    # "dependency-name >= version", 
]

authors = [
    {name = "Joe Defen", email = "joedef@duck.com"},
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Terminals",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
# The minimum a contributor needs to run the suite, and the release toolchain.
# `./bless` refuses to start unless `twine` and `packaging` meet its own floors
# (`twine>=7`, `packaging>=26`), so the dev extra installs a toolchain the gate
# accepts.  `tomli` is the 3.10 fallback for `bless` and for the tests' use of
# `tomllib`; `requires-python` still allows 3.10.
test = [
    'pytest >= 7.0',
    'pytest-cov >= 4.0',
    'tomli >= 2.0; python_version < "3.11"',
]
dev = [
    'pytest >= 7.0',
    'pytest-cov >= 4.0',
    'ruff >= 0.9',
    'build >= 1.2',
    'twine >= 7',
    'packaging >= 26',
    'tomli >= 2.0; python_version < "3.11"',
]

[project.urls]
Homepage = "https://github.com/joedefen/console-window"
Repository = "https://github.com/joedefen/console-window"
Issues = "https://github.com/joedefen/console-window/issues"
Changelog = "https://github.com/joedefen/console-window/blob/main/CHANGELOG.md"

# ----------------------------------------------------------------------
# RELEASE GATE CONFIGURATION
[tool.bless]
# The branch model `./bless` keeps.  `["main"]` releases from the trunk alone;
# `["main", "dev"]` -- the default when this table says nothing -- requires a
# `dev` branch both locally and on origin, and fast-forwards whichever of the
# two lags onto the other before tagging.  This tree commits to the trunk, so a
# release is `main` and the tag.
branches = ["main"]

# The rest is derived rather than written here: the distribution name comes
# from `[project] name`, the package holding `__version__` from that name with
# `-` and `.` turned into `_`, and the inspector from
# `tests/inspect_dist.py`.  There is no `[project.scripts]` entry on purpose:
# this is a library, so the smoke stage of `bless` imports the installed
# package and prints `__version__` instead of running a console script.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pad overflow is a UserWarning rather than an error, by design: a user's app
# should be told and keep limping (AUDIT.md §3.2).  Our own code has no such
# excuse, so within this suite any UserWarning fails the run -- which is how the
# sample app's too-small head pad and its truncated help screen were found.
filterwarnings = ["error::UserWarning"]

[tool.coverage.run]
# Pin the measured package so the number the release gate prints is the same
# whichever directory pytest is started from.
source = ["console_window"]
omit = ["tests/*"]

[tool.coverage.report]
# Measured at 90.69% when the shared release gate was adopted.  The floor is a
# ratchet against new code arriving without a test, not a target to optimize;
# raise it when the number rises, never lower it.
fail_under = 90
show_missing = true

# ----------------------------------------------------------------------
# RUFF LINT CONFIGURATION
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "ANN", "RUF", "C901"]
# E501 (line length) is left to the editor; E701/E731 are pre-existing compact
# style choices that are tracked separately.
ignore = ["E501", "E701", "E731"]

[tool.ruff.lint.mccabe]
# Ratchet, not a target: `answer()` is the most complex function left at 12.
# `prompt()` used to be 43; it is decomposed now, so this ceiling stops any
# function from drifting back toward a single unmaintainable block.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests and the interactive demos are not part of the typed public API, so
# annotation rules do not apply there.
"tests/**" = ["ANN"]
"demos/**" = ["ANN"]

# ----------------------------------------------------------------------
# MYPY TYPE CHECKING
[tool.mypy]
python_version = "3.10"
# Check the library, not the tests/example: those are unannotated by design
# (see the ruff per-file-ignores above).
files = ["console_window"]
ignore_missing_imports = true
warn_unused_ignores = true
# Modest on purpose: ruff already requires annotations, but requiring a fully
# typed body in every function would flag the curses/dynamic-object edges first.
disallow_untyped_defs = false
